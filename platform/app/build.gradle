def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY');
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
}
else {
    apply plugin: 'com.android.library'
}

def assetNames = ["lang", "mods", "dynos", "palettes"]

android {
    compileSdkVersion 33
    // Same NDK the CI installs and uses for the 32-bit libraries (scripts/build-armv7-deps.sh).
    ndkVersion "27.0.12077973"
    defaultConfig {
        if (buildAsApplication) {
            // Own id so it can sit next to the upstream app; data folder name is unchanged.
            applicationId "com.xxdankeykongxx.sm64firetv"
        }
        multiDexEnabled false
        minSdkVersion 24
        // 29 + requestLegacyExternalStorage: Fire OS 8 (Android 11) has no "All files access"
        // screen, so the classic storage permission is the only one that works there.
        targetSdkVersion 29
        // CI passes -PbuildNumber; the launcher's updater compares versionCode with the latest release.
        def buildNumber = project.hasProperty('buildNumber') ? project.property('buildNumber').toInteger() : 0
        versionCode 1000 + buildNumber
        versionName "1.5.1-firetv." + buildNumber
        buildConfigField "String", "UPDATE_REPO", "\"" + (System.getenv("GITHUB_REPOSITORY") ?: "xXDankeyKongXx/sm64-firetv") + "\""
        ndk {
            moduleName = "app"
            ldLibs "log"
            debugSymbolLevel 'FULL'
        }
        externalNativeBuild {
            ndkBuild {
                arguments "-j" + Runtime.runtime.availableProcessors()
                // Fire TV: 32-bit ARM only
                abiFilters 'armeabi-v7a'
            }
        }
    }
    buildFeatures {
        buildConfig true
    }
    // Permanent release key (SOH_SIGNING secret, same key as the Ship of Harkinian Fire TV app),
    // so updates install over the previous version.
    signingConfigs {
        release {
            def ks = System.getenv("SOH_KEYSTORE")
            if (ks != null && new File(ks).exists()) {
                storeFile file(ks)
                storeType "pkcs12"
                storePassword System.getenv("SOH_KEYSTORE_PASSWORD")
                keyAlias "soh-firetv"
                keyPassword System.getenv("SOH_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            signingConfig System.getenv("SOH_KEYSTORE") != null ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt')
        }
        debug {
            minifyEnabled false
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }
    tasks.register("copyGameAssets") {
        doLast {
            def dest = file("$projectDir/src/main/assets")
            if (dest.exists()) {
                dest.deleteDir()
            }
            dest.mkdirs()
            assetNames.each { folderName ->
                def src = new File(rootProject.projectDir, folderName)
                if (src.exists()) {
                    copy {
                        from src
                        into new File(dest, folderName)
                    }
                }
            }
        }
    }
    preBuild.dependsOn copyGameAssets
    namespace 'com.maniscat2.sm64coopdx'
    lint {
        abortOnError false
    }
    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
        }
    }

    // commons-compress / junrar ship license files and Java 9 module descriptors that collide
    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/DEPENDENCIES',
                         'META-INF/*.md', 'META-INF/versions/9/module-info.class', 'module-info.class']
        }
    }
    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "com.maniscat2.sm64coopdx.aar";
                    output.outputFile = new File(outputFile.parent, fileName);
                }
            }
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'org.jetbrains:annotations:15.0'
    // Unpacking GameBanana downloads in the launcher: 7z (+ LZMA via xz) and RAR4
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.tukaani:xz:1.10'
    implementation 'com.github.junrar:junrar:7.5.5'
}
