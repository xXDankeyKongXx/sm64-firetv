# Builds the Fire TV (32-bit ARM) APK on every push to main, publishes it to the apk-builds
# branch and, when the signing secret is set, as a GitHub release for the in-app updater.
name: Fire TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      NDK_VERSION: 27.0.12077973
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Host tools and Android NDK
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git python3 libglew-dev libsdl2-dev libz-dev libcurl4-openssl-dev ninja-build cmake
          export ANDROID_HOME="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" "platforms;android-33" "build-tools;34.0.0" | tail -2
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Generate host-side sources (build/us_pc)
        # The Android build compiles a few files the desktop build generates (animation and demo
        # data tables, headers). No ROM is needed: the game reads its assets from the ROM at runtime.
        run: make -j$(nproc)

      - name: Build 32-bit libraries (SDL2, Lua, libjuice, coopnet)
        run: scripts/build-armv7-deps.sh

      - name: Signing key
        env:
          SOH_SIGNING: ${{ secrets.SOH_SIGNING }}
        run: |
          # Secret format: "<password>:<base64 PKCS12 keystore>" (same key as the Ship of Harkinian
          # Fire TV app). Without it the APK is debug-signed and no release is published.
          if [ -n "$SOH_SIGNING" ]; then
            CLEAN=$(printf '%s' "$SOH_SIGNING" | tr -d ' \t\r\n')
            PW="${CLEAN%%:*}"
            B64="${CLEAN#*:}"
            echo "::add-mask::$PW"
            echo "secret length ${#CLEAN}, key part ${#B64} chars"
            if ! printf '%s' "$B64" | base64 -d > "$RUNNER_TEMP/soh.p12" 2>/dev/null; then
              echo "::error::SOH_SIGNING doesn't contain a valid key (got ${#B64} base64 characters; the file has 1384). Re-paste the whole file."
              exit 1
            fi
            if ! keytool -list -keystore "$RUNNER_TEMP/soh.p12" -storetype PKCS12 -storepass "$PW" > "$RUNNER_TEMP/ks.txt" 2>&1; then
              echo "::error::SOH_SIGNING key or password is wrong. Re-paste the whole file."
              exit 1
            fi
            grep -i "SHA-256" "$RUNNER_TEMP/ks.txt" || true
            echo "SOH_KEYSTORE=$RUNNER_TEMP/soh.p12" >> "$GITHUB_ENV"
            echo "SOH_KEYSTORE_PASSWORD=$PW" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::SOH_SIGNING secret not set: debug-signed build, no release"
          fi

      - name: Build APK
        working-directory: platform
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace -PbuildNumber=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sm64-firetv-apk
          path: platform/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to the apk-builds branch
        run: |
          mkdir publish && cp platform/app/build/outputs/apk/release/*.apk publish/
          cd publish
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -q -b apk-builds
          git add -A
          git commit -qm "Fire TV APK from ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" apk-builds

      - name: Publish GitHub release (used by the in-app updater)
        if: env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls platform/app/build/outputs/apk/release/*.apk | head -1)
          CODE=$((1000 + ${{ github.run_number }}))
          cp "$APK" SM64-FireTV.apk
          NOTES=$(git log -1 --pretty=%B | head -c 3000)
          gh release create "vc-$CODE" SM64-FireTV.apk \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Fire TV build ${{ github.run_number }}" \
            --notes "$NOTES"
